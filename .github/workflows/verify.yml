name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - migration_develop

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Validate Terraform
        run: |
          terraform version
          terraform -chdir=infra/oci fmt -check -diff
          terraform -chdir=infra/oci init -backend=false
          terraform -chdir=infra/oci validate

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Architecture harness
        run: pnpm test:harness

      - name: ESLint
        run: pnpm lint

      - name: FSD architecture lint
        run: pnpm lint:fsd

      - name: Format check
        run: pnpm format:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit:run
      - run: pnpm test:ops

  postgres_integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: PostgreSQL integration
        run: pnpm test:integration:postgres
        env:
          M7_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_ENV: staging

  verify:
    name: verify
    if: always()
    needs:
      - infra
      - quality
      - unit
      - postgres_integration
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require all verification jobs
        env:
          INFRA_RESULT: ${{ needs.infra.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          POSTGRES_RESULT: ${{ needs.postgres_integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          for result in \
            "${INFRA_RESULT}" \
            "${QUALITY_RESULT}" \
            "${UNIT_RESULT}" \
            "${POSTGRES_RESULT}" \
            "${BUILD_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Verification dependency did not succeed: ${result}" >&2
              exit 1
            fi
          done

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/migration_develop'
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: oci-development-image
    permissions:
      contents: read

    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate OCIR configuration
        run: |
          required=(OCIR_REGISTRY OCIR_NAMESPACE OCIR_REPOSITORY)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub environment variable: ${name}" >&2
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Check existing traceability tag
        id: existing
        run: |
          image="${OCIR_REGISTRY}/${OCIR_NAMESPACE}/${OCIR_REPOSITORY}:git-${GITHUB_SHA}"
          if digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}' 2>/dev/null)" && [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish image
        id: image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:git-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=staging
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Record release identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
        run: |
          image="${OCIR_REGISTRY}/${OCIR_NAMESPACE}/${OCIR_REPOSITORY}"
          {
            echo "### Published OCI development image"
            echo
            echo "\`${image}@${IMAGE_DIGEST}\`"
            echo
            echo "Deploy this digest through the OCI DevOps manual release gate."
          } >> "${GITHUB_STEP_SUMMARY}"
