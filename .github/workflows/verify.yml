name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Validate Terraform
        run: |
          terraform version
          terraform -chdir=infra/oci fmt -check -diff
          terraform -chdir=infra/oci init -backend=false
          terraform -chdir=infra/oci validate

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Architecture harness
        run: pnpm test:harness

      - name: ESLint
        run: pnpm lint

      - name: FSD architecture lint
        run: pnpm lint:fsd

      - name: Format check
        run: pnpm format:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit:run
      - run: pnpm test:ops

  postgres_integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Validate Terraform
        run: |
          terraform version
          terraform -chdir=infra/oci fmt -check -diff
          terraform -chdir=infra/oci init -backend=false
          terraform -chdir=infra/oci validate

      - run: pnpm install --frozen-lockfile

      - name: PostgreSQL integration
        run: pnpm test:integration:postgres
        env:
          M7_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres

  app_build:
    name: app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false # The GitHub-hosted VM is discarded after this job.
      - name: Restore verification layer cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ runner.os }}-verify-amd64-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-verify-amd64-v1-
      - name: Build standalone container and both apps
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          tags: oioi-bwg:workspace-check
          build-args: NEXT_PUBLIC_APP_ENV=staging
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/buildx-cache-new,mode=max,compression=zstd,compression-level=3
      - name: Export both standalone apps from the same builder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: verification-artifacts
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_APP_ENV=staging
          outputs: type=local,dest=${{ runner.temp }}/ci-build
      - name: Archive verified container
        run: docker save --output "${{ runner.temp }}/ci-build/web-image.tar" oioi-bwg:workspace-check
      - uses: actions/upload-artifact@v4
        with:
          name: ci-standalone
          path: ${{ runner.temp }}/ci-build/standalone.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ci-web-image
          path: ${{ runner.temp }}/ci-build/web-image.tar
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Replace cache with current layers
        run: |
          rm -rf "${{ runner.temp }}/buildx-cache"
          mv "${{ runner.temp }}/buildx-cache-new" "${{ runner.temp }}/buildx-cache"
      - name: Save verification layer cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  build:
    name: build
    needs: app_build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: ci-standalone
          path: ${{ runner.temp }}/ci-build
      - uses: actions/download-artifact@v4
        with:
          name: ci-web-image
          path: ${{ runner.temp }}/ci-build
      - name: Restore this run's verified build
        run: |
          tar -xzf "${{ runner.temp }}/ci-build/standalone.tar.gz"
          docker load --input "${{ runner.temp }}/ci-build/web-image.tar"

      - name: Install smoke test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test standalone container
        run: |
          set -euo pipefail
          docker run --detach --name web-workspace-check \
            --publish 127.0.0.1:3000:3000 \
            --env AUTH_SECRET=workspace-smoke-local-only-secret \
            --env AUTH_TRUST_HOST=true \
            oioi-bwg:workspace-check
          trap 'docker logs web-workspace-check; docker rm --force web-workspace-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          node tests/ops/web-standalone-smoke.mjs http://127.0.0.1:3000

      - name: Smoke test private Console standalone
        run: |
          set -euo pipefail
          HOSTNAME=127.0.0.1 PORT=3001 \
            CONSOLE_AUTH_SECRET=console-workspace-smoke-local-only-secret \
            CONSOLE_ORIGIN=http://127.0.0.1:3001 \
            node apps/console/.next/standalone/apps/console/server.js > /tmp/console-smoke.log 2>&1 &
          console_pid=$!
          trap 'kill "${console_pid}"; cat /tmp/console-smoke.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/healthz; then break; fi
            sleep 1
          done
          node tests/ops/console-standalone-smoke.mjs http://127.0.0.1:3001

  admin_integration:
    name: Admin migration integration
    needs: app_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ci-standalone
          path: ${{ runner.temp }}/ci-build
      - name: Restore this run's verified apps
        run: tar -xzf "${{ runner.temp }}/ci-build/standalone.tar.gz"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Complete existing admin flows on both private standalone origins
        run: pnpm test:integration:admin
        env:
          M7_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
          P04_ARTIFACT_DIR: .local/p04-admin-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p04-admin-smoke
          path: .local/p04-admin-smoke
          if-no-files-found: ignore

  verify:
    name: verify
    if: always()
    needs:
      - infra
      - quality
      - unit
      - postgres_integration
      - admin_integration
      - app_build
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require all verification jobs
        env:
          INFRA_RESULT: ${{ needs.infra.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          ADMIN_INTEGRATION_RESULT: ${{ needs.admin_integration.result }}
          POSTGRES_RESULT: ${{ needs.postgres_integration.result }}
          APP_BUILD_RESULT: ${{ needs.app_build.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          for result in \
            "${INFRA_RESULT}" \
            "${QUALITY_RESULT}" \
            "${UNIT_RESULT}" \
            "${POSTGRES_RESULT}" \
            "${ADMIN_INTEGRATION_RESULT}" \
            "${APP_BUILD_RESULT}" \
            "${BUILD_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Verification dependency did not succeed: ${result}" >&2
              exit 1
            fi
          done

  promotion-candidate:
    name: promotion candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'migration_develop' &&
      github.event.pull_request.head.ref == 'migration_main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: oci-development-image
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: promotion_smoke
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promotion_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      IMAGE_REPOSITORY: ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/${{ vars.OCIR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate promotion source and verification tree
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const promotion = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/promotion.mjs');
            await promotion.prepare({ github, context, core });
      - name: Validate image build configuration
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          required=(OCIR_REGISTRY OCIR_NAMESPACE OCIR_REPOSITORY NEXT_PUBLIC_SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub environment configuration: ${name}" >&2
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v3
      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}
      - name: Build and publish ARM64 candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:candidate-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=staging
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}
            SENTRY_RELEASE=oioi-bwg@${{ steps.source.outputs.source_sha }}
            SENTRY_SOURCE_MAPS_ENABLED=true
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate isolated smoke database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/promotion_smoke
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pull and smoke the published digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          docker pull --platform linux/arm64 "${image}"
          [[ "$(docker image inspect "${image}" --format '{{.Architecture}}')" == 'arm64' ]]
          docker run --detach --name promotion-smoke --network host \
            --env DATABASE_URL=postgresql://postgres@127.0.0.1:5432/promotion_smoke \
            --env AUTH_SECRET=promotion-smoke-local-only-secret --env AUTH_TRUST_HOST=true "${image}"
          trap 'docker logs promotion-smoke; docker rm --force promotion-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/readyz
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          node tests/ops/web-standalone-smoke.mjs http://127.0.0.1:3000
      - name: Record verified candidate and recheck head
        uses: actions/github-script@v7
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        with:
          script: |
            const promotion = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/promotion.mjs');
            await promotion.record({ github, context, core });
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-${{ steps.source.outputs.source_sha }}-${{ github.run_attempt }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 90
      - name: Notify candidate result
        if: always()
        continue-on-error: true
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          PHASE: candidate
          PUBLISH_RESULT: ${{ steps.image.outcome }}
          CANDIDATE_RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 ops/oci/slack-deploy-payload.py > /tmp/slack-payload.json
          curl --fail-with-body --silent --show-error --request POST \
            --header 'Content-Type: application/json' --data-binary @/tmp/slack-payload.json "${SLACK_DEPLOY_WEBHOOK_URL}"

  promotion:
    name: promotion
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'migration_develop'
    needs: [verify, promotion-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Require full verification and verified candidate
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CANDIDATE_RESULT: ${{ needs.promotion-candidate.result }}
        run: |
          [[ "${VERIFY_RESULT}" == 'success' && "${CANDIDATE_RESULT}" == 'success' ]]
