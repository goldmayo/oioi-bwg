name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - migration_develop

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: PostgreSQL integration
        run: pnpm test:integration:postgres
        env:
          M7_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - run: pnpm format:check
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_ENV: staging

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/migration_develop'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: oci-development-image
    permissions:
      contents: read

    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate OCIR configuration
        run: |
          required=(OCIR_REGISTRY OCIR_NAMESPACE OCIR_REPOSITORY)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub environment variable: ${name}" >&2
              exit 1
            fi
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}:git-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=staging
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record release identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="${OCIR_REGISTRY}/${OCIR_NAMESPACE}/${OCIR_REPOSITORY}"
          {
            echo "### Published OCI development image"
            echo
            echo "\`${image}@${IMAGE_DIGEST}\`"
            echo
            echo "Deploy this digest through the OCI DevOps manual release gate."
          } >> "${GITHUB_STEP_SUMMARY}"
