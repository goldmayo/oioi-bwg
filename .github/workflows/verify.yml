name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
      - develop

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  changes:
    name: verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify complete PR changes
        id: scope
        run: node scripts/verification-scope.mjs >> "${GITHUB_OUTPUT}"

  partial:
    name: changed files and affected workspaces
    needs: changes
    if: contains(fromJSON('["partial", "impact"]'), needs.changes.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/turbo
            apps/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
            tools/*/*.tsbuildinfo
          key: ${{ runner.os }}-partial-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-partial-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-
      - name: Incremental types, lint, related tests and formatting
        run: pnpm verify
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha }}

  source_verification:
    name: reuse main verification
    needs: changes
    if: contains(fromJSON('["promotion", "history"]'), needs.changes.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and successful main PR checks
        uses: actions/github-script@v7
        with:
          script: |
            const proof = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/source-verification.mjs');
            const verify = context.payload.pull_request.base.ref === 'migration_main'
              ? proof.verifyHistory : proof.verifySource;
            await verify({ github, context, core });

  infra:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Validate Terraform
        run: |
          terraform version
          terraform -chdir=infra/oci fmt -check -diff
          terraform -chdir=infra/oci init -backend=false -lockfile=readonly
          terraform -chdir=infra/oci validate
          node tests/ops/waveform-infra-plan.mjs

  quality:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore type and lint caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/turbo
            apps/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
            tools/*/*.tsbuildinfo
            scripts/*.tsbuildinfo
            tests/*.tsbuildinfo
            *.tsbuildinfo
          key: ${{ runner.os }}-quality-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc', 'packages/config/oxlint/**', 'packages/config/typescript/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-quality-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc', 'packages/config/oxlint/**', 'packages/config/typescript/**') }}-

      - name: Type check
        run: pnpm type-check

      - name: Architecture harness
        run: pnpm test:harness

      - name: Oxlint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  unit:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Restore complete unit-task cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-unit-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-unit-v1-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-
      - run: pnpm test:unit:run
      - run: pnpm test:ops
      - name: Verify Console Runner API ingress with isolated Caddy
        run: python3 -I tests/ops/console-runner-ingress.py
      - name: Verify Runner token materialization with synthetic Vault
        run: sudo env GITHUB_ACTIONS=true python3 -I -B tests/ops/waveform-token-root-fixture.py
      - name: Verify Runner installation and service preparation
        run: sudo env GITHUB_ACTIONS=true python3 -I -B tests/ops/waveform-install-root-fixture.py
      - name: Verify root-protected host paths and paired upgrade
        run: sudo env GITHUB_ACTIONS=true python3 -I tests/ops/host-install-root-fixture.py

  waveform:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: waveform ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false # The GitHub-hosted VM is discarded after this job.
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.33.1
      - name: Identify native verification cache inputs
        id: cache-key
        run: node scripts/verification-cache.mjs waveform >> "${GITHUB_OUTPUT}"
      - name: Restore native verification cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            Linux-verify-arm64-v1-
      - name: Build and verify Rust toolchain
        uses: docker/build-push-action@v6
        with:
          context: ops/waveform
          file: ops/waveform/Dockerfile
          platforms: linux/arm64
          provenance: false
          load: true
          tags: oioi-bwg:waveform-check
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache,tag=rust
          cache-to: ${{ steps.build-cache.outputs.cache-hit != 'true' && format('type=local,dest={0}/buildx-cache-new,tag=rust,mode=max,compression=zstd,compression-level=3', runner.temp) || '' }}
      - name: Verify Rust worker execution
        run: |
          image=$(docker image inspect --format '{{.Id}}' oioi-bwg:waveform-check)
          python3 tests/ops/waveform-smoke.py "$image"
          python3 tests/ops/waveform-acquisition.py "$image"
      - name: Verify Go Runner Queue publisher on ARM64
        uses: docker/build-push-action@v6
        with:
          context: ops/waveform-runner
          file: ops/waveform-runner/Dockerfile
          platforms: linux/arm64
          provenance: false
          load: true
          tags: oioi-bwg:runner-check
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache,tag=runner
          cache-to: ${{ steps.build-cache.outputs.cache-hit != 'true' && format('type=local,dest={0}/buildx-cache-new,tag=runner,mode=max,compression=zstd,compression-level=3', runner.temp) || '' }}
      - name: Verify Docker worker lifecycle with synthetic input
        run: |
          test_dir=$(mktemp -d)
          compiler=$(docker create --network none -e CGO_ENABLED=0 oioi-bwg:runner-check \
            sh -c 'go test -c -tags=integration -o /tmp/worker-integration')
          trap 'docker rm -f "$compiler" >/dev/null; rm -rf "$test_dir"' EXIT
          docker start -a "$compiler"
          docker cp "$compiler:/tmp/worker-integration" "$test_dir/check"
          chmod +x "$test_dir/check"
          P08_DOCKER_IMAGE=$(docker image inspect --format '{{.Id}}' oioi-bwg:waveform-check) \
            "$test_dir/check" -test.v -test.run '^TestDockerWorkerLifecycle$' -test.timeout=60s

      - name: Export verified ARM64 Runner binary
        run: |
          output="${{ runner.temp }}/waveform-runner-arm64"
          mkdir -p "$output"
          container=$(docker create --network none --entrypoint /bin/true oioi-bwg:runner-check)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/oioi-waveform-runner" "$output/runner"
          git rev-parse HEAD > "$output/verified-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$output/verified-tree.txt"
          (cd "$output" && sha256sum runner > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-runner-arm64
          path: ${{ runner.temp }}/waveform-runner-arm64
          if-no-files-found: error
          retention-days: 90

      - name: Verify worker egress in an isolated kernel namespace
        run: |
          docker build --tag oioi-bwg:network-check - <<'DOCKERFILE'
          FROM oioi-bwg:runner-check
          RUN apt-get update && apt-get install -y --no-install-recommends nftables iproute2 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker run --rm --network none --cap-add NET_ADMIN --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            --sysctl net.ipv4.ip_forward=1 --sysctl net.ipv6.conf.all.forwarding=1 \
            -e P08_ISOLATED_NETWORK_TEST=1 \
            -v "$PWD/ops/oci/waveform-egress-guard.py:/repo/ops/oci/waveform-egress-guard.py:ro" \
            -v "$PWD/ops/oci/metadata-guard.py:/repo/ops/oci/metadata-guard.py:ro" \
            -v "$PWD/tests/ops/waveform-egress-kernel.py:/repo/tests/ops/waveform-egress-kernel.py:ro" \
            -w /repo oioi-bwg:network-check python3 -I tests/ops/waveform-egress-kernel.py

      - name: Export the verified worker image without rebuilding
        run: |
          set -euo pipefail
          output="${{ runner.temp }}/waveform-worker-arm64"
          mkdir -p "$output"
          image=$(docker image inspect --format '{{.Id}}' oioi-bwg:waveform-check)
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
          docker image save "$image" | gzip -n -1 > "$output/worker-image.tar.gz"
          printf '%s\n' "$image" > "$output/image-id.txt"
          git rev-parse HEAD > "$output/verified-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$output/verified-tree.txt"
          (cd "$output" && sha256sum worker-image.tar.gz image-id.txt verified-commit.txt verified-tree.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-worker-arm64
          path: ${{ runner.temp }}/waveform-worker-arm64
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Replace native cache with current layers
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "${{ runner.temp }}/buildx-cache"
          mv "${{ runner.temp }}/buildx-cache-new" "${{ runner.temp }}/buildx-cache"
      - name: Save native verification cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Export native cache for publication after merge
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(fromJSON('["migration_main", "migration_develop"]'), github.base_ref)
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-cache-${{ steps.cache-key.outputs.key }}
          path: ${{ runner.temp }}/buildx-cache
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  postgres_integration:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: PostgreSQL integration
        run: pnpm test:integration:postgres
        env:
          M7_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres

  app_build:
    needs: changes
    if: contains(fromJSON('["full", "impact"]'), needs.changes.outputs.mode)
    name: app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false # The GitHub-hosted VM is discarded after this job.
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.33.1
      - name: Identify verification cache inputs
        id: cache-key
        run: node scripts/verification-cache.mjs >> "${GITHUB_OUTPUT}"
      - name: Restore verification layer cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-verify-amd64-v4-
      - name: Build web artifacts and cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: verification-cache
          platforms: linux/amd64
          build-args: |
            BUILD_APP=web
            NEXT_PUBLIC_APP_ENV=local
          outputs: type=cacheonly
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache,tag=web
          cache-to: ${{ steps.build-cache.outputs.cache-hit != 'true' && format('type=local,dest={0}/buildx-cache-new,tag=web,mode=max,compression=zstd,compression-level=3', runner.temp) || '' }}
      - name: Load Web container from its builder
        id: web-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          platforms: linux/amd64
          load: true
          tags: oioi-bwg:workspace-check
          build-args: |
            BUILD_APP=web
            NEXT_PUBLIC_APP_ENV=local
          cache-from: type=local,src=${{ runner.temp }}/${{ steps.build-cache.outputs.cache-hit == 'true' && 'buildx-cache' || 'buildx-cache-new' }},tag=web
      - name: Archive verified Web container
        run: |
          mkdir -p "${{ runner.temp }}/ci-build"
          docker save --output "${{ runner.temp }}/ci-build/web-image.tar" oioi-bwg:workspace-check
      - name: Build console artifacts and cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          target: verification-cache
          platforms: linux/amd64
          build-args: |
            BUILD_APP=console
            NEXT_PUBLIC_APP_ENV=local
          outputs: type=cacheonly
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache,tag=console
          cache-to: ${{ steps.build-cache.outputs.cache-hit != 'true' && format('type=local,dest={0}/buildx-cache-new,tag=console,mode=max,compression=zstd,compression-level=3', runner.temp) || '' }}
      - name: Load Console container from its builder
        id: console-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          target: runner
          platforms: linux/amd64
          load: true
          tags: oioi-bwg-console:workspace-check
          build-args: |
            BUILD_APP=console
            NEXT_PUBLIC_APP_ENV=local
          cache-from: type=local,src=${{ runner.temp }}/${{ steps.build-cache.outputs.cache-hit == 'true' && 'buildx-cache' || 'buildx-cache-new' }},tag=console
      - name: Archive verified Console container
        run: |
          mkdir -p "${{ runner.temp }}/ci-build"
          docker save --output "${{ runner.temp }}/ci-build/console-image.tar" oioi-bwg-console:workspace-check
      - name: Inspect app cache manifests and shared storage
        env:
          CACHE_DIRECTORY: ${{ runner.temp }}/${{ steps.build-cache.outputs.cache-hit == 'true' && 'buildx-cache' || 'buildx-cache-new' }}
        run: node scripts/buildkit-cache-report.mjs "${CACHE_DIRECTORY}" > "${{ runner.temp }}/ci-build/cache-metadata.json"
      - name: Record verified image metadata
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WEB_BUILD_DIGEST: ${{ steps.web-runtime.outputs.digest }}
          CONSOLE_BUILD_DIGEST: ${{ steps.console-runtime.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          const images = Object.fromEntries([['web', 'oioi-bwg'], ['console', 'oioi-bwg-console']].map(([app, tag]) => {
            const [image] = JSON.parse(execFileSync('docker', ['image', 'inspect', tag + ':workspace-check'], { encoding: 'utf8' }));
            return [app, { id: image.Id, bytes: image.Size, buildDigest: process.env[app.toUpperCase() + '_BUILD_DIGEST'] }];
          }));
          const cache = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'ci-build/cache-metadata.json'), 'utf8'));
          const metadata = { sourceSha: process.env.SOURCE_SHA, checkoutSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(), runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, images, cache };
          const report = JSON.stringify(metadata, null, 2);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'ci-build/image-metadata.json'), report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n```json\n' + report + '\n```\n');
          console.log(report);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-metadata
          path: ${{ runner.temp }}/ci-build/image-metadata.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ci-web-image
          path: ${{ runner.temp }}/ci-build/web-image.tar
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ci-console-image
          path: ${{ runner.temp }}/ci-build/console-image.tar
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Replace cache with current layers
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "${{ runner.temp }}/buildx-cache"
          mv "${{ runner.temp }}/buildx-cache-new" "${{ runner.temp }}/buildx-cache"
      - name: Save verification layer cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Export cache for publication after merge
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(fromJSON('["migration_main", "migration_develop"]'), github.base_ref)
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-cache-${{ steps.cache-key.outputs.key }}
          path: ${{ runner.temp }}/buildx-cache
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build:
    name: build
    needs: app_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: image_smoke
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d image_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: ci-web-image
          path: ${{ runner.temp }}/ci-build
      - uses: actions/download-artifact@v4
        with:
          name: ci-console-image
          path: ${{ runner.temp }}/ci-build
      - name: Restore this run's verified build
        run: |
          docker load --input "${{ runner.temp }}/ci-build/web-image.tar"
          docker load --input "${{ runner.temp }}/ci-build/console-image.tar"

      - name: Install smoke test browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Prepare isolated lyrics regression fixture
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/image_smoke
          LYRICS_SMOKE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/image_smoke
        run: |
          pnpm db:migrate
          node tests/ops/lyrics-viewer-fixture.mjs

      - name: Smoke test standalone container
        run: |
          set -euo pipefail
          node tests/ops/container-native-smoke.mjs oioi-bwg:workspace-check web
          docker run --detach --name web-workspace-check \
            --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:3000:3000 \
            --env DATABASE_URL=postgresql://postgres@host.docker.internal:5432/image_smoke \
            oioi-bwg:workspace-check
          trap 'docker logs web-workspace-check; docker rm --force web-workspace-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          node tests/ops/container-readiness-smoke.mjs http://127.0.0.1:3000
          node tests/ops/web-standalone-smoke.mjs http://127.0.0.1:3000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-viewer-smoke-amd64
          path: ${{ runner.temp }}/lyrics-viewer-smoke
          if-no-files-found: ignore

      - name: Smoke test private Console standalone
        run: |
          set -euo pipefail
          node tests/ops/container-native-smoke.mjs oioi-bwg-console:workspace-check console
          docker run --detach --name console-workspace-check \
            --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:3001:3000 \
            --env DATABASE_URL=postgresql://postgres@host.docker.internal:5432/image_smoke \
            --env CONSOLE_AUTH_SECRET=console-workspace-smoke-local-only-secret \
            --env CONSOLE_ORIGIN=http://127.0.0.1:3001 \
            --env CONSOLE_MFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env R2_ENDPOINT=https://r2.example.test --env R2_BUCKET=smoke \
            --env R2_ACCESS_KEY_ID=smoke-only --env R2_SECRET_ACCESS_KEY=smoke-only \
            --env ASSETS_PUBLIC_BASE_URL=https://assets.example.test \
            oioi-bwg-console:workspace-check
          trap 'docker logs console-workspace-check; docker rm --force console-workspace-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/healthz; then break; fi
            sleep 1
          done
          node tests/ops/container-readiness-smoke.mjs http://127.0.0.1:3001
          node tests/ops/console-standalone-smoke.mjs http://127.0.0.1:3001

      - name: Verify Console waveform socket DAC and read-only mount
        run: bash tests/ops/waveform-console-socket-smoke.sh
      - name: Verify paired Compose container preservation and recovery
        run: bash tests/ops/paired-compose-smoke.sh

  verify:
    name: ${{ needs.changes.outputs.mode == 'partial' && 'partial verify' || 'verify' }}
    if: always()
    needs:
      - changes
      - partial
      - source_verification
      - infra
      - quality
      - unit
      - waveform
      - postgres_integration
      - app_build
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
      - name: Require exact evidence for the selected verification mode
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verification-scope.mjs --gate

  # One release verification; build only affected apps using proven paired deployment evidence.
  promotion_plan:
    name: promotion plan
    if: >-
      ${{ !cancelled() &&
      needs.verify.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'migration_develop' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.ref == 'migration_main' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oci-development-image
    outputs:
      build_matrix: ${{ steps.selection.outputs.build_matrix }}
    env: &promotion-env
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}
      OCIR_CONSOLE_REPOSITORY: ${{ vars.OCIR_CONSOLE_REPOSITORY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      SENTRY_SOURCE_MAPS_ENABLED: "true"
      IMAGE_REPOSITORY: ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/${{ vars.OCIR_REPOSITORY }}
      CONSOLE_IMAGE_REPOSITORY: ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/${{ vars.OCIR_CONSOLE_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate promotion source and verification tree
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const promotion = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/promotion.mjs');
            await promotion.prepare({ github, context, core });
      - name: Validate image build configuration
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          required=(OCIR_REGISTRY OCIR_NAMESPACE OCIR_REPOSITORY OCIR_CONSOLE_REPOSITORY NEXT_PUBLIC_SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub environment configuration: ${name}" >&2
              exit 1
            fi
          done
          [[ "${IMAGE_REPOSITORY}" != "${CONSOLE_IMAGE_REPOSITORY}" ]]
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Find last successful paired deployment evidence
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const reuse = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/release-baseline.mjs');
            await reuse.findBaseline({ github, context, core });
      - uses: actions/download-artifact@v4
        if: steps.baseline.outputs.artifact_id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/paired-baseline
      - name: Validate deployment evidence and select image builds
        id: selection
        uses: actions/github-script@v7
        env:
          IMAGE_PLAN_FILE: ${{ runner.temp }}/promotion-image-plan.json
          BASELINE_DIR: ${{ runner.temp }}/paired-baseline
          BASELINE_ARTIFACT_ID: ${{ steps.baseline.outputs.artifact_id }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
          BASELINE_RUN_ATTEMPT: ${{ steps.baseline.outputs.run_attempt }}
        with:
          script: |
            const reuse = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/release-baseline.mjs');
            await reuse.selectImages({ github, context, core });
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-image-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-image-plan.json
          if-no-files-found: error
          retention-days: 1

  promotion_images:
    name: promotion image (${{ matrix.app }})
    if: ${{ !cancelled() && needs.promotion_plan.result == 'success' && needs.promotion_plan.outputs.build_matrix != '[]' }}
    needs: promotion_plan
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.promotion_plan.outputs.build_matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: oci-development-image
    env: *promotion-env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}
      - name: Build and publish ARM64 candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runner
          platforms: linux/arm64
          push: true
          tags: ${{ matrix.repository }}:candidate-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BUILD_APP=${{ matrix.app }}
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_GTM_ID=${{ matrix.app == 'web' && vars.NEXT_PUBLIC_GTM_ID || '' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}
            SENTRY_RELEASE=oioi-bwg@${{ github.event.pull_request.head.sha }}
            SENTRY_SOURCE_MAPS_ENABLED=true
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ matrix.repository }}:buildcache-arm64-v1
          cache-to: type=registry,ref=${{ matrix.repository }}:buildcache-arm64-v1,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      - name: Record image source and run identity
        uses: actions/github-script@v7
        env:
          BUILD_APP: ${{ matrix.app }}
          BUILT_IMAGE_REPOSITORY: ${{ matrix.repository }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        with:
          script: |
            const promotion = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/promotion.mjs');
            await promotion.recordImage({ github, context, core });
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-built-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.app }}.json
          if-no-files-found: error
          retention-days: 1

  promotion-candidate:
    name: promotion candidate
    if: >-
      ${{ !cancelled() &&
      needs.verify.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'migration_develop' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.ref == 'migration_main' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [verify, promotion_plan, promotion_images]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: oci-development-image
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: promotion_smoke
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promotion_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: *promotion-env
    steps:
      - name: Require complete image builds
        env:
          PLAN_RESULT: ${{ needs.promotion_plan.result }}
          IMAGE_RESULT: ${{ needs.promotion_images.result }}
          BUILD_MATRIX: ${{ needs.promotion_plan.outputs.build_matrix }}
        run: |
          [[ "${PLAN_RESULT}" == 'success' &&
             ( "${IMAGE_RESULT}" == 'success' ||
             ( "${IMAGE_RESULT}" == 'skipped' && "${BUILD_MATRIX}" == '[]' ) ) ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: promotion-image-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-plan
      - run: mkdir -p "${{ runner.temp }}/promotion-images"
      - uses: actions/download-artifact@v4
        if: needs.promotion_plan.outputs.build_matrix != '[]'
        with:
          pattern: promotion-built-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/promotion-images
      - name: Validate parallel image results and current source
        id: images
        uses: actions/github-script@v7
        env:
          IMAGE_PLAN_FILE: ${{ runner.temp }}/promotion-plan/promotion-image-plan.json
          IMAGE_RESULTS_DIR: ${{ runner.temp }}/promotion-images
        with:
          script: |
            const promotion = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/promotion.mjs');
            await promotion.resolveImages({ github, context, core });
      - name: Migrate isolated smoke database
        run: |
          pnpm db:migrate
          LYRICS_SMOKE_DATABASE_URL="$DATABASE_URL" node tests/ops/lyrics-viewer-fixture.mjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/promotion_smoke
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Log in to OCIR for paired smoke
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}
      - name: Pull and smoke the exact image pair together
        env:
          PAIR_SMOKE_FILE: ${{ runner.temp }}/promotion-pair-smoke.json
          IMAGE_DIGEST: ${{ steps.images.outputs.web_digest }}
          CONSOLE_IMAGE_DIGEST: ${{ steps.images.outputs.console_digest }}
          WEB_BUILD_SOURCE_SHA: ${{ steps.images.outputs.web_build_source_sha }}
          CONSOLE_BUILD_SOURCE_SHA: ${{ steps.images.outputs.console_build_source_sha }}
        run: bash ops/oci/smoke-paired-candidate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-viewer-smoke-arm64
          path: ${{ runner.temp }}/lyrics-viewer-smoke
          if-no-files-found: ignore
      - name: Record verified candidate and recheck head
        uses: actions/github-script@v7
        env:
          IMAGE_PLAN_FILE: ${{ runner.temp }}/promotion-plan/promotion-image-plan.json
          PAIR_SMOKE_FILE: ${{ runner.temp }}/promotion-pair-smoke.json
          IMAGE_DIGEST: ${{ steps.images.outputs.web_digest }}
          CONSOLE_IMAGE_DIGEST: ${{ steps.images.outputs.console_digest }}
        with:
          script: |
            const promotion = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/promotion.mjs');
            await promotion.record({ github, context, core });
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 90
      - name: Clean up candidate smoke containers
        if: always()
        run: docker rm --force promotion-smoke console-promotion-smoke >/dev/null 2>&1 || true
      - name: Notify candidate result
        if: always()
        continue-on-error: true
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          PHASE: candidate
          PUBLISH_RESULT: ${{ steps.images.outputs.web_publish_result || needs.promotion_images.result }}
          CONSOLE_PUBLISH_RESULT: ${{ steps.images.outputs.console_publish_result || needs.promotion_images.result }}
          CANDIDATE_RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE_DIGEST: ${{ steps.images.outputs.web_digest }}
          CONSOLE_IMAGE_DIGEST: ${{ steps.images.outputs.console_digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 ops/oci/slack-deploy-payload.py > /tmp/slack-payload.json
          curl --fail-with-body --silent --show-error --request POST \
            --header 'Content-Type: application/json' --data-binary @/tmp/slack-payload.json "${SLACK_DEPLOY_WEBHOOK_URL}"

  promotion:
    name: promotion
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'migration_develop'
    needs: [verify, promotion-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Require source verification and verified candidate
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CANDIDATE_RESULT: ${{ needs.promotion-candidate.result }}
        run: |
          [[ "${VERIFY_RESULT}" == 'success' && "${CANDIDATE_RESULT}" == 'success' ]]
