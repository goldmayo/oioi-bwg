name: Deploy OCI development

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
    branches:
      - migration_develop

concurrency:
  group: deploy-oci-development
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'migration_develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oci-development-image
    permissions:
      contents: read

    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ap-osaka-1
      OCI_COMPUTE_COMPARTMENT_OCID: ocid1.compartment.oc1..aaaaaaaavs5y44txsstgn5px5zfwynupw3m4mvlgndaje6q3lyi3hi65ucbq
      OCI_COMPUTE_INSTANCE_OCID: ocid1.instance.oc1.ap-osaka-1.anvwsljrhcgbyoacqa6id2hr257tlu26cfjd7x7yywnai7hh37kkytix57cq
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          required=(
            OCIR_REGISTRY
            OCIR_NAMESPACE
            OCIR_REPOSITORY
            OCI_CLI_USER
            OCI_CLI_TENANCY
            OCI_CLI_FINGERPRINT
            OCI_CLI_KEY_CONTENT
            OCI_CLI_REGION
            OCI_COMPUTE_COMPARTMENT_OCID
            OCI_COMPUTE_INSTANCE_OCID
            SOURCE_SHA
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing deployment configuration: ${name}" >&2
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Resolve published manifest digest
        id: release
        run: |
          set -euo pipefail
          image="${OCIR_REGISTRY}/${OCIR_NAMESPACE}/${OCIR_REPOSITORY}:git-${SOURCE_SHA}"
          digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid OCIR manifest digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${OCIR_REGISTRY}/${OCIR_NAMESPACE}/${OCIR_REPOSITORY}@${digest}"

      - name: Verify OCI API authentication
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: >-
            compute instance get
            --instance-id ${{ env.OCI_COMPUTE_INSTANCE_OCID }}
          query: data.id

      - name: Deploy immutable digest with OCI Run Command
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          bash ops/oci/deploy-via-run-command.sh "${IMAGE_DIGEST}"

      - name: Record deployment result
        if: success()
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          {
            echo "### OCI development deployment succeeded"
            echo
            echo "Commit: \`${SOURCE_SHA}\`"
            echo
            echo "Digest: \`${IMAGE_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
