name: P06 B0 command probe

on:
  pull_request:
    types: [labeled]
    branches: [migration_develop]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: b0-command-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.label.name == 'p06-b0-command' &&
      github.event.pull_request.base.ref == 'migration_develop' &&
      github.event.pull_request.head.ref == 'migration_main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oci-development-image
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require current source and host probe attestation
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const probe = await import(process.env.GITHUB_WORKSPACE + '/ops/oci/b0-command-gate.mjs');
            await probe.prepareCommand({ github, context, core });
      - name: Install OCI CLI before loading credentials
        run: |
          python3 -m venv "${RUNNER_TEMP}/b0-oci"
          "${RUNNER_TEMP}/b0-oci/bin/pip" install oci-cli==3.95.0
          echo "${RUNNER_TEMP}/b0-oci/bin" >> "${GITHUB_PATH}"
      - name: Create and verify a new secret-free command
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          OCI_COMPUTE_COMPARTMENT_OCID: ${{ vars.OCI_COMPUTE_COMPARTMENT_OCID }}
          OCI_COMPUTE_INSTANCE_OCID: ${{ vars.OCI_COMPUTE_INSTANCE_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: python3 -I ops/oci/b0-ci-probe.py command
      - uses: actions/upload-artifact@v4
        with:
          name: b0-command-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: b0-command-proof.json
          if-no-files-found: error
          retention-days: 14
