name: Publish build cache

on:
  push:
    branches: [migration_main, migration_develop]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: publish-build-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish merged verification cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select successful verification of the merged tree
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const cache = await import(process.env.GITHUB_WORKSPACE + '/scripts/verification-cache.mjs');
            await cache.findMergedCache({ github, context, core });
      - name: Check shared cache
        if: steps.source.outputs.artifact_id != ''
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.source.outputs.key }}
          lookup-only: true
      - name: Download verified layer cache
        if: steps.source.outputs.artifact_id != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/buildx-cache
      - name: Publish cache in the base branch scope
        if: steps.source.outputs.artifact_id != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.source.outputs.key }}
