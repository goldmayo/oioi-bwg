name: P02 Validation

on:
  push:
    branches:
      - feature/p02-shared-config-turbo

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose Turbo cache inputs
        run: |
          pnpm exec turbo run type-check lint test --dry=json > /tmp/turbo-before.json
          pnpm exec turbo run type-check lint test
          echo "::group::git status after first run"
          git status --short --untracked-files=all
          echo "::endgroup::"
          pnpm exec turbo run type-check lint test --dry=json > /tmp/turbo-after.json
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/turbo-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/turbo-after.json', 'utf8'));
          const pick = (data) => Object.fromEntries(data.tasks.map((task) => [task.task, task.hash]));
          console.log('before hashes', pick(before));
          console.log('after hashes', pick(after));
          NODE
          pnpm exec turbo run type-check lint test
      - name: Full local verify
        run: pnpm verify
      - name: Inspect affected task selection
        env:
          TURBO_SCM_BASE: origin/migration_main
        run: pnpm exec turbo run type-check lint test --affected --dry=json
