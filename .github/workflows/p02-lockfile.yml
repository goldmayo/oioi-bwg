name: P02 Validation

on:
  push:
    branches:
      - feature/p02-shared-config-turbo

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full local verify
        run: pnpm verify
      - name: Confirm Turbo local cache replay
        run: pnpm exec turbo run type-check lint test build
      - name: Inspect affected task selection
        env:
          TURBO_SCM_BASE: origin/migration_main
        run: pnpm exec turbo run type-check lint test --affected --dry=json
